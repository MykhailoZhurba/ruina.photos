name: Deploy to Cloudflare Workers

# The Worker needs no write access to the repository; it only reads the source.
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the source repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Astro site
        run: npm run build

      # Requires a CLOUDFLARE_API_TOKEN repository secret, created from the
      # "Edit Cloudflare Workers" template. Secrets set with `wrangler secret
      # put` live in Cloudflare and are not touched by this deploy.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
